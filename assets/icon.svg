<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A6E"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#E9C98F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <circle cx="300" cy="230" r="420" fill="#3B4CC0" opacity="0.25"/>
    <g transform="translate(-95 10)">
      <!-- crest -->
      <path d="M430 380 C 380 300 330 250 250 240 C 320 300 350 350 360 410 Z" fill="#F97316"/>
      <path d="M470 365 C 450 270 410 200 340 160 C 390 240 400 310 395 390 Z" fill="#EF4444"/>
      <path d="M520 360 C 530 270 510 200 470 150 C 480 230 470 300 450 370 Z" fill="#FACC15"/>
      <!-- head and neck -->
      <path d="M300 940 C 270 760 270 560 360 450 C 440 350 600 330 690 420 C 740 470 750 530 745 590 C 700 640 650 680 640 760 C 630 830 650 890 680 940 Z" fill="url(#head)"/>
      <!-- cheek -->
      <ellipse cx="610" cy="610" rx="78" ry="62" fill="#FDE047" opacity="0.9"/>
      <!-- beak -->
      <path d="M700 430 C 800 420 870 490 862 600 C 858 655 830 690 800 676 C 812 615 790 560 715 552 Z" fill="url(#beak)"/>
      <path d="M712 556 C 765 560 795 590 792 640 C 760 660 725 645 705 618 Z" fill="#1F2937"/>
      <!-- eye -->
      <circle cx="620" cy="480" r="50" fill="#fff"/>
      <circle cx="632" cy="482" r="27" fill="#0B1230"/>
      <circle cx="642" cy="470" r="9" fill="#fff"/>
    </g>
    <!-- sound waves -->
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="26">
      <path d="M 805 520 A 70 70 0 0 1 805 640" opacity="0.95"/>
      <path d="M 845 470 A 130 130 0 0 1 845 690" opacity="0.6"/>
    </g>
  </g>
</svg>
